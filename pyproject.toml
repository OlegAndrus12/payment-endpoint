[project]
name = "payment-endpoint"
version = "0.1.0"
description = "Payment endpoint take-home task"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.0.7",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.5.2",
    "gunicorn>=26.2.0",
    "faker>=40.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "black>=24.10.0",
    "ruff>=0.7.4",
    "factory-boy>=3.3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
